<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BFE3FF">
<title>E-CIBL · Offline</title>
<style>
  :root { --ink:#0F172A; --muted:#475569; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:linear-gradient(#BFE3FF, #F3FAFF 60%, #fff); display:grid; place-items:center; padding:24px; }
  .kartu { max-width:420px; width:100%; background:#fff; border-radius:28px; padding:32px 24px; text-align:center; box-shadow:0 20px 40px -12px rgba(15,23,42,.12); }
  img { width:72px; height:72px; border-radius:20px; }
  h1 { font-size:22px; margin:16px 0 6px; } p { color:var(--muted); margin:0 0 20px; }
  button { font:700 16px system-ui; background:#111; color:#fff; border:0; border-radius:999px; min-height:48px; padding:0 28px; cursor:pointer; }
  button:focus-visible { outline:3px solid #38BDF8; outline-offset:3px; }
</style>
</head>
<body>
  <main class="kartu">
    <img src="./icon-192.png" alt="">
    <h1>Tidak ada koneksi internet</h1>
    <p>E-CIBL butuh internet untuk memuat materi dan menyimpan pekerjaanmu. Jawaban LKM yang sudah kamu ketik tetap aman di perangkat.</p>
    <button onclick="location.href='./'">Coba lagi</button>
  </main>
</body>
</html>
